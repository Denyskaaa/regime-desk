name: Research data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["research/fetch_history.py", ".github/workflows/research.yml"]

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m research.fetch_history
      - name: Commit history files
        run: |
          git config user.name "regime-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "research: long history for backtest"
          git pull -q --rebase --autostash || true
          git push -q
