name: Update data and deploy

on:
  schedule:
    - cron: "7,37 13-21 * * 1-5"  # every 30 min across US trading hours (UTC; covers EDT and EST)
    - cron: "15 22 * * 1-5"       # once more after the close
    - cron: "7 15 * * 6"          # Saturday: crypto and any late macro releases
  workflow_dispatch:
    inputs:
      force_macro:
        description: "Refresh every FRED series now"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["pipeline/**", "docs/*.html", "docs/*.js", "docs/*.css", "requirements.txt", ".github/workflows/update.yml"]

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data and build the site's JSON
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}  # optional; FRED's public CSV is used without it
        run: python -m pipeline.run ${{ (github.event_name == 'push' || inputs.force_macro) && '--force-macro' || '' }}

      - name: Save data back to the repo (cache for the next run)
        run: |
          git config user.name "regime-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -q -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase --autostash || true
          git push -q

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
